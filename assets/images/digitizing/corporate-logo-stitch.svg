<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#141c2c"/>
    </linearGradient>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgLogo)"/>

  <!-- Left Side: Vector Outline vs Right Side: Digitized Stitches -->
  <g transform="translate(160, 240)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="0,-70 50,30 -50,30" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <text x="0" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#94a3b8" text-anchor="middle">1. Client Vector Input (AI / SVG / PNG)</text>
  </g>

  <!-- Flow Arrow -->
  <g transform="translate(400, 240)">
    <path d="M -50 0 L 50 0 M 30 -15 L 50 0 L 30 15" stroke="#6366f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="-20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#818cf8" text-anchor="middle">WILCOM ES</text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#94a3b8" text-anchor="middle">Path Optimization</text>
  </g>

  <!-- Right Side: Digitized Stitches -->
  <g transform="translate(640, 240)">
    <!-- Simulated Satin Border -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#techGrad)" stroke-width="12" filter="url(#logoGlow)"/>
    <circle cx="0" cy="0" r="94" fill="#0f172a"/>
    <!-- Simulated Tatami Fill Inner Polygon -->
    <polygon points="0,-65 46,26 -46,26" fill="url(#techGrad)" opacity="0.9"/>
    <!-- Stitch Lines -->
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 2"/>
    <line x1="-20" y1="12" x2="20" y2="12" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="0" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#38bdf8" text-anchor="middle">2. Production Machine File (DST / PES)</text>
  </g>

  <!-- Spec Badges Bar -->
  <g transform="translate(40, 480)">
    <rect width="720" height="90" rx="16" fill="#0b1120" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#f8fafc">
      Vector-to-Embroidery Logo Digitizing &amp; Clean Pathing
    </text>
    <text x="24" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#94a3b8">
      Zero Thread Breakage • Minimal Trims • Pull Compensation • Wilcom Studio
    </text>

    <!-- Format Pills -->
    <rect x="520" y="24" width="60" height="26" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="550" y="42" font-family="monospace" font-weight="bold" font-size="12" fill="#10b981" text-anchor="middle">DST</text>

    <rect x="590" y="24" width="60" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="620" y="42" font-family="monospace" font-weight="bold" font-size="12" fill="#a855f7" text-anchor="middle">EMB</text>

    <rect x="660" y="24" width="48" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="684" y="42" font-family="monospace" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">JEF</text>

    <text x="520" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">
      📷 Placeholder Sample
    </text>
  </g>

  <!-- Top Category Pill -->
  <g transform="translate(40, 30)">
    <rect width="180" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#10b981"/>
    <text x="32" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#d1fae5">
      LOGO DIGITIZING
    </text>
  </g>
</svg>
