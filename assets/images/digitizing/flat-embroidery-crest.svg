<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="threadGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="threadCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="stitchPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 4 L 8 4" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="3 1" opacity="0.15"/>
      <path d="M 4 0 L 4 8" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="3 1" opacity="0.15"/>
    </pattern>
    <pattern id="satinHatch" width="4" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#f59e0b" stroke-width="2.5" opacity="0.8"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bgG)"/>
  <rect width="800" height="600" fill="url(#stitchPattern)"/>

  <!-- Embroidery Hoop Graphic -->
  <circle cx="400" cy="280" r="210" fill="none" stroke="#334155" stroke-width="12" opacity="0.4"/>
  <circle cx="400" cy="280" r="195" fill="#0f172a" opacity="0.7" filter="url(#shadow)"/>

  <!-- Embroidered Crest / Shield -->
  <g transform="translate(400, 270)">
    <!-- Shield Outer Stitch Line -->
    <path d="M 0 -130 L 90 -70 L 90 40 C 90 100, 0 140, 0 140 C 0 140, -90 100, -90 40 L -90 -70 Z" 
          fill="#1e293b" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 3"/>
    
    <!-- Shield Inner Fill with Satin Hatch -->
    <path d="M 0 -115 L 75 -60 L 75 35 C 75 88, 0 125, 0 125 C 0 125, -75 88, -75 35 L -75 -60 Z" 
          fill="url(#satinHatch)" stroke="url(#threadGold)" stroke-width="4"/>
    
    <!-- Central Monogram MZ -->
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="54" 
          fill="#ffffff" text-anchor="middle" letter-spacing="-2" filter="url(#shadow)">MZ</text>

    <!-- Star Badges (Simulated Stitch) -->
    <path d="M 0 -70 L 6 -52 L 24 -52 L 10 -40 L 15 -22 L 0 -34 L -15 -22 L -10 -40 L -24 -52 L -6 -52 Z" fill="#fbbf24"/>
    <path d="M -45 -50 L -41 -37 L -27 -37 L -37 -28 L -34 -15 L -45 -23 L -56 -15 L -53 -28 L -63 -37 L -49 -37 Z" fill="#fbbf24"/>
    <path d="M 45 -50 L 49 -37 L 63 -37 L 53 -28 L 56 -15 L 45 -23 L 34 -15 L 37 -28 L 27 -37 L 41 -37 Z" fill="#fbbf24"/>
  </g>

  <!-- Spec Badges Bar -->
  <g transform="translate(40, 480)">
    <rect width="720" height="90" rx="16" fill="#0b1120" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#f8fafc">
      Flat Embroidery Digitizing — Corporate Crest
    </text>
    <text x="24" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#94a3b8">
      Satin Stitch Outline • Tatami Underlay • Density: 0.40mm • Software: Wilcom ES
    </text>

    <!-- Format Pills -->
    <rect x="520" y="24" width="60" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="550" y="42" font-family="monospace" font-weight="bold" font-size="12" fill="#38bdf8" text-anchor="middle">DST</text>

    <rect x="590" y="24" width="60" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="620" y="42" font-family="monospace" font-weight="bold" font-size="12" fill="#a855f7" text-anchor="middle">EMB</text>

    <rect x="660" y="24" width="48" height="26" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="684" y="42" font-family="monospace" font-weight="bold" font-size="12" fill="#10b981" text-anchor="middle">PES</text>

    <text x="520" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">
      📷 Placeholder Sample
    </text>
  </g>

  <!-- Top Category Pill -->
  <g transform="translate(40, 30)">
    <rect width="210" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#6366f1"/>
    <text x="32" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#c7d2fe">
      FLAT EMBROIDERY
    </text>
  </g>
</svg>
