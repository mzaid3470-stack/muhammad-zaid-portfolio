<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="capGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgCap)"/>

  <!-- Cap Crown Outline -->
  <g transform="translate(400, 250)" filter="url(#capShadow)">
    <!-- Structured Cap Front Panel -->
    <path d="M -220 120 Q 0 -130 220 120 C 140 140, -140 140, -220 120 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Center Seam Line -->
    <line x1="0" y1="-70" x2="0" y2="130" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="0" y="-85" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">CENTER SEAM (SEAM SPLIT LOGIC)</text>

    <!-- Center-Out Sequence Stitch Arrows -->
    <path d="M 0 30 L -90 30 M -70 20 L -90 30 L -70 40" stroke="#8b5cf6" stroke-width="3" fill="none"/>
    <path d="M 0 30 L 90 30 M 70 20 L 90 30 L 70 40" stroke="#8b5cf6" stroke-width="3" fill="none"/>

    <!-- Embroidered Wings Emblem Across Center -->
    <path d="M 0 0 C 40 -30, 100 -20, 140 10 C 100 20, 40 10, 0 35 C -40 10, -100 20, -140 10 C -100 -20, -40 -30, 0 0 Z" 
          fill="url(#capGlow)" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="0" cy="18" r="14" fill="#ffffff"/>
    <text x="0" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#0f172a" text-anchor="middle">MZ</text>
  </g>

  <!-- Spec Badges Bar -->
  <g transform="translate(40, 480)">
    <rect width="720" height="90" rx="16" fill="#0b1120" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#f8fafc">
      Cap &amp; Headwear Digitizing — Center-Out / Bottom-Up Flow
    </text>
    <text x="24" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="13" fill="#94a3b8">
      Center Seam Alignment • Zero Fabric Bunching • Low Profile &amp; High Profile Caps
    </text>

    <rect x="520" y="24" width="60" height="26" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
    <text x="550" y="42" font-family="monospace" font-weight="bold" font-size="12" fill="#8b5cf6" text-anchor="middle">DST</text>

    <rect x="590" y="24" width="60" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="620" y="42" font-family="monospace" font-weight="bold" font-size="12" fill="#a855f7" text-anchor="middle">EMB</text>

    <rect x="660" y="24" width="48" height="26" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
    <text x="684" y="42" font-family="monospace" font-weight="bold" font-size="12" fill="#ec4899" text-anchor="middle">PES</text>

    <text x="520" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">
      📷 Placeholder Sample
    </text>
  </g>

  <!-- Top Category Pill -->
  <g transform="translate(40, 30)">
    <rect width="210" height="32" rx="16" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#8b5cf6"/>
    <text x="32" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ede9fe">
      CAP &amp; HEADWEAR DIGITIZING
    </text>
  </g>
</svg>
